name: medisign_mobile
description: MediSign AI Flutter mobile app
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  http: ^1.2.0

  # Fitness / AI Coach dependencies
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.12.0
  flutter_tts: ^4.0.0
  speech_to_text: ^6.6.0
  vector_math: ^2.1.0
  tflite_flutter: ^0.10.4
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/signs/
