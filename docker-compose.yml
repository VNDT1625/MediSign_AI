# MediSign AI — local stack.
#
# Postgres credentials and JWT secret are loaded from .env. The defaults below
# are only fallbacks for local-dev; production deployments must override them
# via environment variables, secret managers, or a separate compose override.
version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend_fastapi/Dockerfile
    env_file:
      - .env
    environment:
      # Override DATABASE_URL so the container talks to the postgres service
      # rather than the value committed in .env (which often points at
      # localhost for host-machine development).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medisign}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medisign}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medisign}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
