openapi: 3.0.3
info:
  title: MediSign AI API
  version: 0.2.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /consult/triage:
    post:
      tags: [consult]
      summary: Medical triage consultation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
      responses:
        '200':
          description: Triage result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /medicine/scan:
    post:
      tags: [medicine]
      summary: Medicine scan and interaction hint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicineScanRequest'
      responses:
        '200':
          description: Medicine scan result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineScanResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Login and issue token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/status:
    get:
      tags: [ai]
      summary: AI runtime and RAG status
      responses:
        '200':
          description: AI status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatusResponse'

  /ai/chat:
    post:
      tags: [ai]
      summary: Chat with trained model and optional RAG context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/rag/status:
    get:
      tags: [ai]
      summary: RAG index status
      responses:
        '200':
          description: RAG status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /ai/rag/rebuild:
    post:
      tags: [ai]
      summary: Rebuild RAG index from configured knowledge base
      responses:
        '200':
          description: Rebuild result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /ai/rag/search:
    post:
      tags: [ai]
      summary: Search MediSign knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGSearchRequest'
      responses:
        '200':
          description: RAG search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGSearchResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    TriageRequest:
      type: object
      required: [symptom_text]
      properties:
        symptom_text:
          type: string
          minLength: 3
          maxLength: 1000
          example: Dau hong nhe 2 ngay
        locale:
          type: string
          default: vi-VN
          minLength: 2
          maxLength: 10
          example: vi-VN

    TriageResponse:
      type: object
      required: [urgency_level, summary, recommendations]
      properties:
        urgency_level:
          type: string
          enum: [non_emergency, urgent, emergency]
        summary:
          type: string
        recommendations:
          type: array
          items:
            type: string

    MedicineScanRequest:
      type: object
      required: [extracted_text]
      properties:
        extracted_text:
          type: string
          minLength: 2
          maxLength: 500
          example: Paracetamol 500mg
        current_medications:
          type: array
          items:
            type: string

    MedicineScanResponse:
      type: object
      required: [normalized_name, risk_level, warnings, guidance]
      properties:
        normalized_name:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high]
        warnings:
          type: array
          items:
            type: string
        guidance:
          type: string

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 10

    AuthTokenPair:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer

    RAGSource:
      type: object
      required: [record_id, type, title, score, confidence, needs_medical_review, source]
      properties:
        record_id:
          type: string
        type:
          type: string
        title:
          type: string
        score:
          type: number
        confidence:
          type: string
        needs_medical_review:
          type: boolean
        source:
          type: object
          additionalProperties: true

    RAGSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
        adapter:
          type: string
          default: medical
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5

    RAGSearchResponse:
      type: object
      required: [query, hits, context]
      properties:
        query:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/RAGSource'
        context:
          type: string

    AIChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        system_prompt:
          type: string
          nullable: true
        adapter:
          type: string
          default: medical
        use_rag:
          type: boolean
          default: true
        rag_top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5

    AIChatResponse:
      type: object
      required: [provider, model, adapter, content, fallback_used, rag_used, sources]
      properties:
        provider:
          type: string
        model:
          type: string
        adapter:
          type: string
        content:
          type: string
        fallback_used:
          type: boolean
        rag_used:
          type: boolean
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RAGSource'

    AIStatusResponse:
      type: object
      required:
        [provider, model, base_url, medical_adapter_path, psychology_adapter_path, ready, detail, rag]
      properties:
        provider:
          type: string
        model:
          type: string
        base_url:
          type: string
        medical_adapter_path:
          type: string
        psychology_adapter_path:
          type: string
        ready:
          type: boolean
        detail:
          type: string
        rag:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
        request_id:
          type: string
          nullable: true
