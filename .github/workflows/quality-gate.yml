name: Quality Gate

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["dev"]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test

      - name: Flutter Format Check
        run: dart format --output=none --set-exit-if-changed .

  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend_fastapi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backend lint and tests
        run: |
          ruff check .
          black --check .
          python -m pytest

      - name: Validate OpenAPI contract
        run: |
          python -c "from pathlib import Path; import yaml; from openapi_spec_validator import validate_spec; spec_path=Path('../../packages/shared_contracts/openapi/medisign-api.openapi.yaml'); spec=yaml.safe_load(spec_path.read_text(encoding='utf-8')); validate_spec(spec)"
